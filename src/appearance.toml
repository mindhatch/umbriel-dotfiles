[appearance]
prefer_no_csd = true
border_width = 4               # 0-100
outer_border_width = 2         # 0-100
corner_radius = 12             # 0-100
drag_opacity = 0.75

[appearance.blur]
enabled = true
optimized = true
passes = 2                     # 0-8
radius = 1                     # 0-100
noise = 0.02                   # 0.0-1.0
brightness = 1.0               # 0.0-2.0
contrast = 1.1                 # 0.0-2.0
saturation = 1.6

[appearance.shadow]
enabled = true
softness = 10                  # 0-200, 0 = hard edge
offset_x = 0                   # -200 to 200
offset_y = 0

[layout]
mode = "scrolling"
gap = 16

[layout.scrolling]
default_extent_fraction = 0.5
center_underfull_strip = true
center_focused = "never"

[layout.master]
position = "right"
default_width_fraction = 0.7
new_on_top = false

[overview]
zoom = 0.5
background_blur = true
workspace_wallpaper = true
shortcuts = false

[output.eDP-1]
mode = "2304x1440@59.945"
position = [0, 0]
workspaces = ["一", "二", "三", "四", "五"]

[[workspace]]
name = "三"
layout.mode = "master"
